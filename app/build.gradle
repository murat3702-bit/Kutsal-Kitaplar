plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mb.dortkitap.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mb.dortkitap.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.17"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
