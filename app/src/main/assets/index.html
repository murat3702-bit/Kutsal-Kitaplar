<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Dört Kitap</title>
<link rel="stylesheet" href="style.css" />
<script>
  // Yükleme sırasında bir hata olursa boş ekran yerine hatayı ekranda göster.
  window.dkFail = function (msg) {
    try {
      var d = document.getElementById("dkErr");
      if (!d) {
        d = document.createElement("pre");
        d.id = "dkErr";
        d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;background:#fff;color:#b00020;font:13px/1.4 monospace;";
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += msg + "\n";
    } catch (e) {}
  };
  window.onerror = function (msg, src, line, col) {
    window.dkFail("HATA: " + msg + "\n  (" + String(src || "").split("/").pop() + ":" + line + ":" + col + ")");
  };
</script>
</head>
<body>
<div id="app"></div>
<script src="data/kuran.js" onerror="dkFail('Yüklenemedi: data/kuran.js')"></script>
<script src="data/incil.js" onerror="dkFail('Yüklenemedi: data/incil.js')"></script>
<script src="data/tevrat.js" onerror="dkFail('Yüklenemedi: data/tevrat.js')"></script>
<script src="data/zebur.js" onerror="dkFail('Yüklenemedi: data/zebur.js')"></script>
<script>
  ["KURAN_DATA", "INCIL_DATA", "TEVRAT_DATA", "ZEBUR_DATA"].forEach(function (k) {
    if (!window[k]) window.dkFail("Veri okunamadı: " + k);
  });
</script>
<script src="app.js" onerror="dkFail('Yüklenemedi: app.js')"></script>
</body>
</html>
