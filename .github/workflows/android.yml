name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    # Her gün gece 03:00'te (UTC) 24 saati geçmiş sürümleri kontrol edip siler
    - cron: '0 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build-and-clean:
    name: Build Signed APK and Clean Old Releases
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      if: github.event_name != 'schedule'
      with:
        persist-credentials: true
    
    - name: set up JDK 17
      if: github.event_name != 'schedule'
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      if: github.event_name != 'schedule'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Kalıcı VersionName ve APP_VERSION Artır (1.99 -> 2.00)
      id: version
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      run: |
        FILE="app/build.gradle"
        JS_FILE="app/src/main/assets/app.js"
        
        # 1. Mevcut versionName değerini okur
        CURRENT_NAME=$(grep -oE 'versionName[ =("]+"[^"]+"' "$FILE" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
        
        if [ -z "$CURRENT_NAME" ]; then
          echo "HATA: versionName bulunamadı! Dosya içeriği:"
          grep -i "version" "$FILE"
          exit 1
        fi
        
        MAJOR=$(echo "$CURRENT_NAME" | cut -d'.' -f1)
        MINOR=$(echo "$CURRENT_NAME" | cut -d'.' -f2)
        
        # 2. Alt sürümü +1 artırır ve 99'u geçerse ana sürümü yükseltir (1.99 -> 2.00)
        MINOR=$((10#$MINOR + 1))
        if [ "$MINOR" -gt 99 ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
        fi
        
        NEW_NAME=$(printf "%d.%02d" "$MAJOR" "$MINOR")
        
        # 3. Hem app/build.gradle hem de app.js içindeki sürümü günceller
        sed -i -E "s/(versionName[ =(\"]+)[0-9]+\.[0-9]+/\1$NEW_NAME/" "$FILE"
        if [ -f "$JS_FILE" ]; then
          sed -i -E "s/(var APP_VERSION = \")[^\"]+\"/\1$NEW_NAME\"/" "$JS_FILE"
        fi
        
        echo "Yeni Versiyon -> build.gradle ve app.js: $NEW_NAME"
        echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT

        # 4. İki dosyayı da depoya kalıcı olarak kaydeder
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$FILE" "$JS_FILE"
        git commit -m "Versiyon artırıldı: $NEW_NAME [skip ci]"
        git push

    - name: Build Release APK
      if: github.event_name != 'schedule'
      run: gradle assembleRelease --no-daemon --no-build-cache

    - name: Sign Release APK
      if: github.event_name != 'schedule'
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -di > release-key.jks
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out app-v${{ steps.version.outputs.new_name }}-release-signed.apk \
          app-release-aligned.apk

    - name: Release Signed APK
      if: github.event_name != 'schedule'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.new_name }}
        target_commitish: ${{ github.ref_name }}
        name: Release v${{ steps.version.outputs.new_name }}
        files: app-v${{ steps.version.outputs.new_name }}-release-signed.apk
        make_latest: true

    - name: 24 Saatten Eski Sürümleri, Tag'leri ve Önbellekleri Temizle
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CURRENT_TAG: v${{ steps.version.outputs.new_name }}
      run: |
        CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
        echo "Kesim tarihi (UTC): $CUTOFF"
        echo "Korunan güncel sürüm: $CURRENT_TAG"

        gh cache list --repo "${{ github.repository }}" --limit 100 --json id --jq '.[].id' | while read -r CACHE_ID; do
          if [ -n "$CACHE_ID" ]; then
            echo "Önbellek siliniyor: $CACHE_ID"
            gh cache delete "$CACHE_ID" --repo "${{ github.repository }}"
          fi
        done

        gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
          --jq ".[] | select(.createdAt < \"$CUTOFF\") | .tagName" | while read -r TAG; do
            if [ -n "$TAG" ] && [ "$TAG" != "$CURRENT_TAG" ]; then
              echo "Siliniyor: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
            fi
          done
