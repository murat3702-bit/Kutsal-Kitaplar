name: Android CI

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Kalıcı VersionName ve APP_VERSION Artır (1.99 -> 2.00)
      id: version
      if: github.event_name != 'pull_request'
      run: |
        FILE="app/build.gradle"
        JS_FILE="app/src/main/assets/app.js"
        
        # 1. Mevcut versionName değerini okur
        CURRENT_NAME=$(grep -oE 'versionName[ =]+"[^"]+"' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
        MAJOR=$(echo "$CURRENT_NAME" | cut -d'.' -f1)
        MINOR=$(echo "$CURRENT_NAME" | cut -d'.' -f2)
        
        # 2. Alt sürümü +1 artırır ve 99'u geçerse ana sürümü yükseltir (1.99 -> 2.00)
        MINOR=$((10#$MINOR + 1))
        if [ "$MINOR" -gt 99 ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
        fi
        
        NEW_NAME=$(printf "%d.%02d" "$MAJOR" "$MINOR")
        
        # 3. Hem app/build.gradle hem de app.js içindeki sürümü günceller
        sed -i -E "s/(versionName[ =]+\")[^\"]+\"/\1$NEW_NAME\"/" "$FILE"
        sed -i -E "s/(var APP_VERSION = \")[^\"]+\"/\1$NEW_NAME\"/" "$JS_FILE"
        
        echo "Yeni Versiyon -> build.gradle ve app.js: $NEW_NAME"
        echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT

        # 4. İki dosyayı da depoya kalıcı olarak kaydeder
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$FILE" "$JS_FILE"
        git commit -m "Versiyon artırıldı: $NEW_NAME [skip ci]"
        git push

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    - name: Sign Release APK
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release-key.jks
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out app-release-signed.apk \
          app-release-aligned.apk

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ steps.version.outputs.new_name }}-release-signed
        path: app-release-signed.apk
